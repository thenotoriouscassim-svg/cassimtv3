services:
  - type: web
    name: jarvis-ai-cassimtv
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: uvicorn cloud_main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
