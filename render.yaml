services:
  - type: web
    name: jarvis-ai-cassimtv
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: uvicorn cloud_main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: FISH_API_KEY
        sync: false
      - key: FISH_AUDIO_VOICE_ID
        sync: false
      - key: FISH_AUDIO_MODEL
        value: s2.1-pro-free
