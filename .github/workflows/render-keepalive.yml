name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping JARVIS backend health endpoint
        run: |
          curl --fail --silent --show-error \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            https://cassimtv3.onrender.com/health
