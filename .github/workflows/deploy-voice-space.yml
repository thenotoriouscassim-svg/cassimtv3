name: Deploy JARVIS voice clone to Hugging Face

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "voice_service/**"
      - "assets/audio/jarvis_boot.mp3"
      - "assets/audio/jarvis_request_root.mp3"
      - "assets/audio/jarvis_app_closed.mp3"
      - ".github/workflows/deploy-voice-space.yml"

jobs:
  deploy:
    if: \${{ secrets.HF_TOKEN != '' && secrets.HF_SPACE_REPO_ID != '' && secrets.JARVIS_VOICE_API_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugging Face Hub
        run: pip install --upgrade huggingface_hub
      - name: Prepare Space files
        run: |
          mkdir -p hf-space/samples
          cp voice_service/app.py hf-space/app.py
          cp voice_service/requirements.txt hf-space/requirements.txt
          cp voice_service/Dockerfile hf-space/Dockerfile
          cp voice_service/README.md hf-space/README.md
          cp assets/audio/jarvis_boot.mp3 hf-space/samples/
          cp assets/audio/jarvis_request_root.mp3 hf-space/samples/
          cp assets/audio/jarvis_app_closed.mp3 hf-space/samples/
      - name: Create Space, set API secret and deploy
        env:
          HF_TOKEN: \${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO_ID: \${{ secrets.HF_SPACE_REPO_ID }}
          JARVIS_VOICE_API_KEY: \${{ secrets.JARVIS_VOICE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          repo_id = os.environ["HF_SPACE_REPO_ID"]
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(repo_id=repo_id, repo_type="space", space_sdk="docker", exist_ok=True)
          api.add_space_secret(repo_id=repo_id, key="JARVIS_VOICE_API_KEY", value=os.environ["JARVIS_VOICE_API_KEY"])
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="hf-space",
              commit_message="Deploy JARVIS XTTS-v2 voice clone",
          )
          print("JARVIS voice service URL: https://" + repo_id.replace("/", "-") + ".hf.space")
          PY
