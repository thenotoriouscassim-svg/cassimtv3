name: Build JARVIS AI APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true

      - name: Restore missing Android project
        shell: bash
        run: |
          if [ ! -f android/app/build.gradle ] || [ ! -f android/settings.gradle ] || [ ! -f android/gradlew ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/jarvis-custom-manifest.xml
            rm -rf android
            flutter create --platforms=android --org com.cassimtv --project-name jarvis_ai /tmp/jarvis_android_scaffold
            cp -R /tmp/jarvis_android_scaffold/android ./android
            cp /tmp/jarvis-custom-manifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Install Android SDK 34
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Android build versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_gradle = Path("android/app/build.gradle")
          source = app_gradle.read_text()
          source = source.replace("flutter.compileSdkVersion", "34")
          source = source.replace("flutter.targetSdkVersion", "34")
          app_gradle.write_text(source)
          print("Android app Gradle configuration:")
          print(source)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyse code
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
