name: Build JARVIS AI APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      # This repository was missing the Android Gradle project. Generate a
      # clean Flutter Android scaffold without touching the Dart app or assets.
      - name: Restore missing Android project
        shell: bash
        run: |
          if [ ! -f android/app/build.gradle ] || [ ! -f android/settings.gradle ] || [ ! -f android/gradlew ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/jarvis-custom-manifest.xml
            rm -rf android
            flutter create --platforms=android --org com.cassimtv --project-name jarvis_ai /tmp/jarvis_android_scaffold
            cp -R /tmp/jarvis_android_scaffold/android ./android
            cp /tmp/jarvis-custom-manifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyse code
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
