name: Build JARVIS AI APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Restore missing Android project
        shell: bash
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ] || [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ] || [ ! -f android/gradlew ]; then
            if [ -f android/app/src/main/AndroidManifest.xml ]; then
              cp android/app/src/main/AndroidManifest.xml /tmp/jarvis-custom-manifest.xml
            fi
            if [ -f android/app/src/main/kotlin/com/cassimtv/jarvis_ai/MainActivity.kt ]; then
              cp android/app/src/main/kotlin/com/cassimtv/jarvis_ai/MainActivity.kt /tmp/jarvis-custom-MainActivity.kt
            fi
            rm -rf android
            flutter create --platforms=android --org com.cassimtv --project-name jarvis_ai .
            if [ -f /tmp/jarvis-custom-manifest.xml ]; then
              cp /tmp/jarvis-custom-manifest.xml android/app/src/main/AndroidManifest.xml
            fi
            if [ -f /tmp/jarvis-custom-MainActivity.kt ]; then
              mkdir -p android/app/src/main/kotlin/com/cassimtv/jarvis_ai
              cp /tmp/jarvis-custom-MainActivity.kt android/app/src/main/kotlin/com/cassimtv/jarvis_ai/MainActivity.kt
            fi
            # Flutter's generated sample test references MyApp, but this app entry point is JarvisApp.
            rm -f test/widget_test.dart
          fi
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/gradlew
          ls -la android

      - name: Install Android SDK 35 and NDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Configure Android build versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = next((p for p in [Path("android/settings.gradle"), Path("android/settings.gradle.kts")] if p.exists()), None)
          app_gradle = next((p for p in [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")] if p.exists()), None)
          if settings is None or app_gradle is None:
              raise SystemExit("Android Gradle files were not generated")

          source = settings.read_text()
          source, agp_count = re.subn(
              r'''(id\s*\(?\s*['"]com\.android\.application['"]\s*\)?\s+version\s+['"])[^'"]+(['"])''',
              r"\g<1>8.6.1\g<2>", source)
          if agp_count != 1:
              raise SystemExit(f"Expected one Android Gradle Plugin declaration, found {agp_count}")
          source, kotlin_count = re.subn(
              r'''(id\s*\(?\s*['"]org\.jetbrains\.kotlin\.android['"]\s*\)?\s+version\s+['"])[^'"]+(['"])''',
              r"\g<1>1.9.24\g<2>", source)
          if kotlin_count != 1:
              raise SystemExit(f"Expected one Kotlin Gradle plugin declaration, found {kotlin_count}")
          settings.write_text(source)

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          source = wrapper.read_text()
          source, count = re.subn(r"gradle-[0-9.]+-(?:all|bin)\.zip", "gradle-8.7-all.zip", source)
          if count != 1:
              raise SystemExit(f"Expected one Gradle distribution URL, found {count}")
          wrapper.write_text(source)

          source = app_gradle.read_text()
          source = source.replace("flutter.compileSdkVersion", "35").replace("flutter.targetSdkVersion", "35")
          source, min_count = re.subn(
              r"(?m)^(\s*minSdk(?:Version)?\s*(?:=|\s)\s*)(?:flutter\.minSdkVersion|[0-9]+)",
              r"\g<1>24", source)
          if min_count != 1:
              raise SystemExit(f"Expected one minSdk declaration, found {min_count}")
          source = source.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          source = source.replace("JavaVersion.VERSION_11", "JavaVersion.VERSION_17")
          source = source.replace("jvmTarget = '1.8'", "jvmTarget = '17'")
          source = source.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
          source = source.replace("jvmTarget = JavaVersion.VERSION_11.toString()", "jvmTarget = JavaVersion.VERSION_17.toString()")
          if "ndkVersion" not in source:
              if app_gradle.suffix == ".kts":
                  source, count = re.subn(r"(?m)^(android\s*\{)", r'\1\n    ndkVersion = "26.1.10909125"', source, count=1)
              else:
                  source, count = re.subn(r"(?m)^(android\s*\{)", r'\1\n    ndkVersion "26.1.10909125"', source, count=1)
              if count != 1:
                  raise SystemExit("Could not set the Android NDK version")
          app_gradle.write_text(source)
          print(f"Configured {settings.name}, {app_gradle.name}, AGP 8.6.1, Gradle 8.7, SDK 35, minSdk 24, Java/Kotlin 17, NDK 26.1.10909125")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyse code
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
