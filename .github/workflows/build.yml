name: Build JARVIS AI APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Restore missing Android project
        shell: bash
        run: |
          if [ ! -f android/app/build.gradle ] || [ ! -f android/settings.gradle ] || [ ! -f android/gradlew ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/jarvis-custom-manifest.xml
            rm -rf android
            flutter create --platforms=android --org com.cassimtv --project-name jarvis_ai /tmp/jarvis_android_scaffold
            cp -R /tmp/jarvis_android_scaffold/android ./android
            cp /tmp/jarvis-custom-manifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Android build versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Android 35 needs a newer Android Gradle Plugin/AAPT2 than the
          # Flutter 3.22 scaffold ships with.
          settings = Path("android/settings.gradle")
          source = settings.read_text()
          source, agp_count = re.subn(
              r"""(id\s+['"]com\.android\.application['"]\s+version\s+['"])[^'"]+(['"])""",
              r"\g<1>8.6.1\g<2>",
              source,
          )
          if agp_count != 1:
              raise SystemExit(f"Expected one Android Gradle Plugin declaration, found {agp_count}")
          source, kotlin_count = re.subn(
              r"""(id\s+['"]org\.jetbrains\.kotlin\.android['"]\s+version\s+['"])[^'"]+(['"])""",
              r"\g<1>1.9.24\g<2>",
              source,
          )
          if kotlin_count != 1:
              raise SystemExit(f"Expected one Kotlin Gradle plugin declaration, found {kotlin_count}")
          settings.write_text(source)

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          source = wrapper.read_text()
          source, wrapper_count = re.subn(
              r"gradle-[0-9.]+-(?:all|bin)\.zip",
              "gradle-8.7-all.zip",
              source,
          )
          if wrapper_count != 1:
              raise SystemExit(f"Expected one Gradle distribution URL, found {wrapper_count}")
          wrapper.write_text(source)

          app_gradle = Path("android/app/build.gradle")
          source = app_gradle.read_text()
          source = source.replace("flutter.compileSdkVersion", "35")
          source = source.replace("flutter.targetSdkVersion", "35")
          source, min_count = re.subn(
              r"(?m)^(\s*minSdk(?:Version)?\s*(?:=|\s)\s*)(?:flutter\.minSdkVersion|[0-9]+)",
              r"\g<1>24",
              source,
          )
          if min_count != 1:
              raise SystemExit(f"Expected one minSdkVersion declaration, found {min_count}")
          app_gradle.write_text(source)
          print("AGP 8.6.1, Kotlin 1.9.24, Gradle 8.7, compile/target SDK 35, minSdk 24 configured")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyse code
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
