
name: jarvis_ai
description: JARVIS AI by CassimTV - AI Assistant
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.1.0
  http_parser: ^4.0.2
  dio: ^5.3.2

  # Audio
  audioplayers: ^5.2.1

  # State management
  provider: ^6.1.1

  # Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3

  # UI
  animated_text_kit: ^4.2.2
  fl_chart: ^0.65.0
  google_fonts: ^6.1.0
  lottie: ^2.7.0
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.18.1
  uuid: ^3.0.7
  connectivity_plus: ^6.1.1
  speech_to_text: ^7.0.0
  url_launcher: ^6.3.0
  shizuku_api: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true


          
