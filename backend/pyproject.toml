[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai-cassimtv"
version = "1.0.0"
description = "JARVIS AI by CassimTV API running on Cloudflare Python Workers"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools]
py-modules = ["worker", "cloud_main", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["actions*", "intelligence*"]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
